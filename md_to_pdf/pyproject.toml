[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etk-md2pdf"
version = "0.1.0"
description = "Edition ToolKit — convert Markdown to print-ready PDF via WeasyPrint"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "markdown>=3.5",
    "weasyprint>=60",
    "pygments>=2.15",
]

[project.optional-dependencies]
pandoc = ["pypandoc>=1.12"]

[project.scripts]
md2pdf = "etk_md2pdf.convert:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["etk_md2pdf*"]

[tool.setuptools.package-data]
etk_md2pdf = ["styles/*.css"]
