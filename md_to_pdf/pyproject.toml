[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etk-md2pdf"
version = "0.2.1"
description = "Edition ToolKit — convert Markdown to print-ready PDF (Typst or WeasyPrint)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# Core deps cover the Typst engine (stdlib-only Python; typst binary installed separately).
# WeasyPrint deps are optional — install with: pip install etk-md2pdf[weasyprint]
dependencies = []

[project.optional-dependencies]
weasyprint = [
    "markdown>=3.5",
    "weasyprint>=60",
    "pygments>=2.15",
]

[project.scripts]
md2pdf = "etk_md2pdf.dispatcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["etk_md2pdf*"]

[tool.setuptools.package-data]
etk_md2pdf = [
    "engines/typst/styles/*.typ",
    "engines/weasyprint/styles/*.css",
]
