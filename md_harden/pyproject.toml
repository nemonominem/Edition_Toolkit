[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etk-md-harden"
version = "0.1.0"
description = "Edition ToolKit — Markdown normaliser and hardener for md2pdf"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# stdlib-only; anthropic is optional (--claude semantic review pass)
dependencies = []

[project.optional-dependencies]
claude = [
    "anthropic>=0.25",
]

[project.scripts]
md_harden = "md_harden:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["md_harden*"]

[tool.setuptools.package-data]
md_harden = []
